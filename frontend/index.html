<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCare - AI Medical Receptionist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"></div>
                <h1>Clinico</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active"><span class="icon">💬</span> Chat</a>
                <a href="#"><span class="icon">📅</span> Appointments</a>
                <a href="#"><span class="icon">⚙️</span> Settings</a>
            </nav>
            <div class="user-profile">
                <div class="avatar">U</div>
                <div class="user-info">
                    <span class="user-name">Test User (ID: 1)</span>
                    <span class="user-status">Online</span>
                </div>
            </div>
        </aside>
        
        <main class="chat-container">
            <header class="chat-header">
                <div class="agent-info">
                    <h2>AgentCare AI</h2>
                    <p>Your Virtual Receptionist</p>
                </div>
                <div class="connection-status" id="status-indicator">
                    <span class="dot connected"></span> Connected
                </div>
            </header>
            
            <div class="chat-history" id="chat-history">
                <div class="message system-message">
                    <div class="message-content">
                        Session started. Test mode active.
                    </div>
                </div>
                <div class="message agent-message">
                    <div class="avatar">A</div>
                    <div class="message-content">
                        Hello! I'm AgentCare, your AI medical receptionist. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <form id="chat-form">
                    <input type="text" id="message-input" placeholder="Type your message here... (e.g. I have a toothache)" autocomplete="off" required>
                    <button type="submit" id="send-btn" class="send-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
