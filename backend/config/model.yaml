default_model: llama

models:
  fast:
    provider: google
    model: gemini-3.5-flash
    temperature: 0.2
    max_tokens: 1024
    api_key_env: GOOGLE_API_KEY

  llama:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.2
    max_tokens: 1024
    api_key_env: GROQ_API_KEY

  medium:
    provider: huggingface
    model: Qwen/Qwen3-8B-Instruct
    temperature: 0.2
    max_tokens: 1024
    api_key_env: HUGGINGFACE_API_KEY